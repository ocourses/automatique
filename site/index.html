<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Explorer le cours</title>
    <link rel="stylesheet" href="socle/css/theme.css" />
    <link rel="stylesheet" href="socle/css/style.css" />
    <link rel="stylesheet" href="css/cours.css" />
    <script type="module">
      import config from './site.config.js';
      import { demarreAccueil } from './socle/js/accueil.js';
      import { greffeSimulateur } from './js/accueil.js';
      await demarreAccueil(config);
      await greffeSimulateur();
    </script>
  </head>
  <body>
    <!-- Modèle du socle (ocots-site/modeles/index.html), dont le module appelle
         demarreAccueil puis greffe le simulateur sur le thème « Commande » :
         cette page n'est pas une copie du modèle (socle/docs/conception.md,
         « Greffe sur l'accueil »), verifieModeles ne l'exige pas. -->
    <header class="entete">
      <h1 id="titre"></h1>
      <p id="sous-titre" class="source"></p>
    </header>
    <noscript>
      <p class="intro">Cette page demande JavaScript.</p>
    </noscript>

    <p id="signalement" class="intro signalement">
      Une erreur, un bug, une remarque ou une idée ? Ouvrez une
      <a id="issues" href="https://github.com/ocourses" target="_blank" rel="noopener">issue sur GitHub</a>
      en décrivant la page, ce que vous avez fait et ce que vous attendiez.
    </p>

    <div id="themes" class="themes"></div>

    <!-- Rubrique du simulateur, placée par js/accueil.js dans le thème « Commande ». -->
    <template id="modele-simulateur">
      <h3 class="sous-rubrique">Simulateur de stabilisation</h3>
      <p class="note">
        Chaque exemple reprend un système du cours. On règle la condition initiale et le contrôleur,
        puis on observe si le système se stabilise.
      </p>

    <!-- Schéma fonctionnel complet d'un système en boucle fermée (poly, introduction).
         Coordonnées de la figure TikZ : (x, y) ↦ (20 + 70x, 252 − 70y). -->
    <section class="carte schema" aria-labelledby="titre-schema">
      <h2 id="titre-schema">La boucle fermée</h2>
      <svg id="schema" viewBox="0 0 870 300" role="group" aria-label="Schéma fonctionnel complet d'un système en boucle fermée">
        <defs>
          <marker id="pointe" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
            <path d="M0,0 L10,5 L0,10 z" />
          </marker>
        </defs>
        <g class="liens">
          <path d="M20,98 H116" marker-end="url(#pointe)" />
          <path d="M272,112 H361" marker-end="url(#pointe)" />
          <path d="M517,112 H606" marker-end="url(#pointe)" />
          <path d="M685,7 V75" marker-end="url(#pointe)" />
          <path d="M762,112 H846" marker-end="url(#pointe)" />
          <path d="M797,112 V252 H659" marker-end="url(#pointe)" />
          <path d="M503,252 H379" marker-end="url(#pointe)" />
          <path d="M223,252 H69 V126 H116" marker-end="url(#pointe)" />
        </g>
        <g class="etiquettes">
          <text x="67" y="90">w(t)</text>
          <text x="317" y="104">u(t)</text>
          <text x="562" y="104">c(t)</text>
          <text x="714" y="45">d(t)</text>
          <text x="815" y="104">x(t)</text>
          <text x="440" y="244">y(t)</text>
          <text x="146" y="244">x̂(t)</text>
        </g>
        <g class="bloc controleur" data-bloc="controleur" tabindex="0" role="button" aria-pressed="false">
          <rect x="118" y="77" width="154" height="70" rx="14" /><text x="195" y="118">Contrôleur</text>
        </g>
        <g class="bloc" data-bloc="actionneur" tabindex="0" role="button" aria-pressed="false">
          <rect x="363" y="77" width="154" height="70" rx="14" /><text x="440" y="118">Actionneur</text>
        </g>
        <g class="bloc" data-bloc="systeme" tabindex="0" role="button" aria-pressed="false">
          <rect x="608" y="77" width="154" height="70" rx="14" /><text x="685" y="118">Système</text>
        </g>
        <g class="bloc" data-bloc="capteurs" tabindex="0" role="button" aria-pressed="false">
          <rect x="503" y="217" width="154" height="70" rx="14" /><text x="580" y="258">Capteurs</text>
        </g>
        <g class="bloc" data-bloc="predicteur" tabindex="0" role="button" aria-pressed="false">
          <rect x="223" y="217" width="154" height="70" rx="14" /><text x="300" y="258">Prédicteur</text>
        </g>
        <!-- Entrées sans bloc dans le poly : zones cliquables autour des étiquettes. -->
        <g class="bloc entree" data-bloc="consigne" tabindex="0" role="button" aria-pressed="false" aria-label="Consigne w(t)">
          <rect x="30" y="68" width="74" height="30" rx="8" />
        </g>
        <g class="bloc entree" data-bloc="perturbation" tabindex="0" role="button" aria-pressed="false" aria-label="Perturbation d(t)">
          <rect x="692" y="24" width="46" height="30" rx="8" />
        </g>
      </svg>
      <p id="legende-schema" class="note" aria-live="polite">
        Le schéma du poly, avec en rouge le contrôleur, sur lequel le cours insiste. Cliquez sur un bloc,
        ou sur w(t) et d(t), pour voir où il se règle dans le simulateur et quels exemples le font intervenir.
      </p>
    </section>

      <div id="catalogue" class="catalogue"></div>
    </template>
  </body>
</html>
